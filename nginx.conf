worker_processes 1;
events { worker_connections 1024; }

http {
    include       /opt/homebrew/etc/nginx/mime.types;
    default_type  application/octet-stream;

    map $http_accept_language $lang {
        default en;
        ~*^es es;
    }

    server {
        listen 8080;
        server_name localhost;
        root /Users/xeraph/dev/portfolio;

        location = / {
            try_files /html/index-$lang.html /html/index-en.html =404;
        }

        location = /cv {
            try_files /cv/cv-$lang.pdf /cv/cv-en.pdf =404;
        }

        location ~* ^/(css|js|img)/ {
            try_files $uri =404;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location = /favicon.ico {
            try_files /public/favicon.ico =404;
            access_log off;
            log_not_found off;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location / {
            return 404;
        }
    }
}
